# macOS shell glass blur (applies to quickshell macos layers)
# These layers are kept translucent in QML so Hyprland's backdrop blur shows through (macOS vibrancy)
layerrule = blur, macos:spotlight
layerrule = blur, macos:controlcenter
layerrule = blur, macos:topbar
layerrule = blur, macos:dock
layerrule = blur, macos:notifications
