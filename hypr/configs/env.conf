#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/
env = XCURSOR_THEME,QingyiBLZ
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = HYPRCURSOR_THEME,QingyiBLZ
env = PATH,/home/revo/.local/bin:$PATH

# أسطر التوافقية الآمنة لـ Nvidia لمنع طرد GDM
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia


# إعدادات ذاكرة Looking Glass لمشاركة الشاشة والتحكم بالـ VM
env = OMARCHY_LOOKING_GLASS,1
env = IVSHMEM_KEY,omarchy-win-vm

# إعدادات Wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = SCREENSHOT_PROVIDER,ext-image-copy-capture-v1
