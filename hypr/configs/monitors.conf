################
### MONITORS ###
################

# Every screen at its own best mode (highest refresh rate at its native
# resolution), placed automatically, with Hyprland's scale for its size.
# Never force one machine's mode here: a 2560x1600 mode on a 1920x1080 panel
# becomes a custom mode that the panel letterboxes (black edges).
# To pin a screen, add a line above the catch-all, e.g.
#   monitor = eDP-1, 2560x1600@120, auto, 1
monitor = , highrr, auto, auto
