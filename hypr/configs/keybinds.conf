$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun
$clipboard = cliphist list
$shiftMod = SHIFT
$Wallpapers = bash ~/.config/hypr/scripts/wallpapers/wallpaper-matugen.sh

$mainMod = SUPER

# Scripts and apps binds

## Exec
bind = $mainMod, T, exec, $terminal
bind = $mainMod, A, exec, bash -c 'echo applauncher > ${XDG_RUNTIME_DIR}/skwd/cmd'
bind = $mainMod, E, exec, nautilus
bind = $mainMod, V, exec, bash ~/.config/hypr/scripts/quickshell/toggle_screenshot_browser.sh
bind = $mainMod, Y, exec, bash ~/.config/hypr/scripts/quickshell/toggle_wallpaper_browser.sh
bind = $mainMod, B, exec, bash ~/.config/hypr/scripts/quickshell/toggle_dots_browser.sh
bind = $mainMod, L, exec, bash ~/.config/hypr/scripts/macos_lock.sh
bind = , XF86PowerOff, exec, bash ~/.config/hypr/scripts/macos_lock.sh
bind = $mainMod, C, exec, bash ~/.config/hypr/scripts/rofi_show.sh drun
bind = $mainMod, X, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle music
# bind = $mainMod, H, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle guide
bind = $mainMod, H, exec, bash ~/.config/hypr/scripts/ryoku_settings.sh
bind = ALT, TAB, exec, bash ~/.config/hypr/scripts/rofi_show.sh window
# set a random wallpaper
bind = $mainMod, R, exec, bash ~/.config/hypr/scripts/wallpapers/wallpaper-matugen.sh
bind = $mainMod, W, exec, bash ~/.config/hypr/scripts/wallpapers/skwd-color-sync.sh

# WM Control binds
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, F, togglefloating,
# bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, J, togglesplit, # dwindle
## Window Switch
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, Tab, workspace, previous
bind = $mainMod ALT, left, workspace, -1
bind = $mainMod ALT, right, workspace, +1


# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, left, movetoworkspace, -1
bind = $mainMod SHIFT, right, movetoworkspace, +1


# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 5%-


# Screenshot a window
bind = $mainMod, -, exec, hyprshot -m window
# Screenshot a monitor
bind = , PRINT, exec, hyprshot -m output
# Screenshot a region
bind = $shiftMod, k, exec, hyprshot -m region

# Apps
bind = $mainMod, D, exec, vesktop
bind = $mainMod, Z, exec, zen-browser
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = $mainMod, P, exec, bash -c 'echo powermenu > ${XDG_RUNTIME_DIR}/skwd/cmd'

bind = $mainMod, N, exec, bash -c 'echo notifications > ${XDG_RUNTIME_DIR}/skwd/cmd'
bind = $mainMod, I, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle settings
bind = $mainMod, O, exec, ~/.config/hypr/scripts/qs_manager.sh toggle movies
bind = $mainMod, U, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle focustime
bind = $mainMod, K, exec, quickshell -p ~/.config/quickshell/TypewriterSplash.qml

# Spotlight Search (SwiftAssets)
bind = $mainMod, SPACE, exec, ~/.local/bin/spotlight-toggle
bind = $mainMod, G, exec, ~/.local/bin/steam-gamescope

# Looking Glass fullscreen toggle
windowrulev2 = fullscreen, class:^(looking-glass-client)$
bind = , F10, fullscreen, 0