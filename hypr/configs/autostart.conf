#################
### AUTOSTART ###
#################

xwayland {
  force_zero_scaling = true
}

exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data
exec-once = systemctl --user start hyprpolkitagent
exec-once = hypridle
# exec-once = sleep 1 && waybar  # disabled: replaced by quickshell

# set a random wallpaper at start and start hyprpaper
exec-once = awww-daemon & sleep 1; $HOME/.config/hypr/scripts/wallpapers/set-random.sh
exec-once = hyprshade on vibrance
exec-once = skwd
exec-once = ~/.config/skwd/scripts/bash/restore-wallpaper
# ── Quickshell + EasyEffects (imperative-dots) ──
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/Main.qml
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/TopBar.qml
exec-once = python3 ~/.config/hypr/scripts/quickshell/focustime/focus_daemon.py &
exec-once = ~/.config/hypr/scripts/init.sh
exec-once = ~/.config/hypr/scripts/qs_manager.sh toggle guide &
exec-once = playerctld
exec-once = swayosd-server --top-margin 0.9
exec-once = ~/.config/hypr/scripts/volume_listener.sh
exec-once = ~/.config/hypr/scripts/settings_watcher.sh &
exec-once = ~/.config/hypr/scripts/update_notifier.sh &
exec-once = systemctl --user enable --now easyeffects

# Typewriter splash on login
exec-once = quickshell -p ~/.config/quickshell/TypewriterSplash.qml

# Maximum performance
exec-once = powerprofilesctl set performance
exec-once = hyprctl setcursor QingyiBLZ 24
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'QingyiBLZ'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24
